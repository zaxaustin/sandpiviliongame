# Builds the installers for Windows AND macOS.
#
# This exists because the dev machine is a Windows box and **a macOS app
# cannot be built on Windows** — the dmg tooling and code-signing are
# macOS-only. GitHub's runners include a real Mac, free for public
# repositories, so the Mac build happens there rather than requiring
# anyone to own one.
#
# Both jobs use `electron:build:beta`, never the plain `electron:build`:
# the beta script reads `.env.beta`, which empties every service
# variable so the build ships local-only, and `scripts/verify-beta-build.mjs`
# fails the build if a cloud host or anything key-shaped survives into the
# bundle. There are no secrets in this workflow, deliberately.
#
# Trigger it by pushing a tag:  git tag v0.1.0-beta.3 && git push --tags
# Or from the Actions tab, by hand.

name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false          # a broken Mac build shouldn't hide a good Windows one
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
            pattern: 'release/*.exe'
          - os: macos-latest
            artifact: macos-installer
            pattern: 'release/*.dmg'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The dependency-free suite. Fast, and it guards the things that have
      # actually broken before — station kinds, inline handlers, the privacy
      # data map, the copyright rules.
      - run: npm test

      # Draws build/icon.ico from scratch (no dependencies). The macOS job
      # needs an .icns; electron-builder converts from the png set, and
      # without this the Mac app would wear the generic Electron icon.
      - run: node scripts/make-icon.mjs

      # ⚠ `--publish never` IS NOT OPTIONAL, AND ITS ABSENCE IS WHY THIS
      # WORKFLOW HAD NEVER ONCE PASSED (beta.6, beta.7, beta.7.1 — every run
      # since it was written, on both runners).
      #
      # electron-builder decides to PUBLISH on its own: when it detects CI and
      # the ref is a tag, it tries to upload to a GitHub Release and needs
      # GH_TOKEN to do it. This workflow has no secrets on purpose (see the
      # header), and it is only ever triggered BY A TAG — so every run hit
      # exactly the condition that makes electron-builder reach for a token
      # that was never going to be there.
      #
      # The artifacts are collected by upload-artifact below, which is the
      # intent: build them, hand them over, let a person decide what to attach
      # to a Release. Publishing was never wanted here, only assumed.
      - name: Build the installer
        run: npm run electron:build:beta -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
